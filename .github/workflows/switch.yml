name: Nintendo Switch bootstrap

on:
  push:
    branches: [ switch-port ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate private real-game build helper
        run: |
          python3 -m py_compile tools/build_switch_real.py
          sh -n tools/r.sh

      - name: Build host analyzer and recompiler
        run: |
          cmake -S . -B build-host -DPS1RECOMP_BUILD_TESTS=OFF -DPS1RECOMP_BUILD_RUNTIME=OFF
          cmake --build build-host --target ps1Analyzer ps1Recomp -j2

      - name: Upload host analysis tools
        uses: actions/upload-artifact@v4
        with:
          name: ps1recomp-host-tools
          path: |
            build-host/ps1Analyzer/ps1Analyzer
            build-host/ps1Recomp/ps1Recomp
            ps1Analyzer/data/psyq_signatures.toml
            ps1Analyzer/data/psyq_metadata.toml

      - name: Generate minimal PS-X EXE
        run: python3 switch/testdata/make_minimal_psxexe.py

      - name: Verify PS-X EXE named .BIN is not mistaken for disc image
        run: |
          cp switch/testdata/minimal.psx.exe switch/testdata/KERNEL.BIN
          ./build-host/ps1Analyzer/ps1Analyzer switch/testdata/KERNEL.BIN switch/testdata/minimal_auto.toml
          test -s switch/testdata/minimal_auto.toml
          grep -q 'entry_point' switch/testdata/minimal_auto.toml

      - name: Recompile MIPS smoke program
        run: ./build-host/ps1Recomp/ps1Recomp switch/testdata/minimal.toml switch/source/recompiled_generated.cpp

      - name: Verify generated source
        run: |
          test -s switch/source/recompiled_generated.cpp
          grep -q "switch_smoke" switch/source/recompiled_generated.cpp
          grep -q "recomp_init_dispatch_table" switch/source/recompiled_generated.cpp
          grep -q "struct recomp_entry_t" switch/source/recompiled_generated.cpp
          ! grep -q "#include <fmt/format.h>" switch/source/recompiled_generated.cpp
          ! grep -q "#include <unordered_map>" switch/source/recompiled_generated.cpp

      - name: Build NRO
        working-directory: switch
        run: make -j2

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: ps1recomp-switch-bootstrap
          path: switch/ps1recomp_switch.nro

      - name: Compile real-game harness with split smoke recompiled source
        run: |
          cp switch/source/recompiled_generated.cpp switch/source/real_recompiled.cpp
          python3 - <<'PY'
          from pathlib import Path
          from tools.build_switch_real import split_generated_cpp
          split_generated_cpp(Path("switch/source/real_recompiled.cpp"), target_bytes=8 * 1024)
          PY
          ls switch/source/real_recompiled_part*.cpp >/dev/null
          test -s switch/source/real_recompiled_dispatch.cpp
          make -C switch clean
          make -C switch REAL_GAME=1 -j2
          test -s switch/ps1recomp_game.nro
